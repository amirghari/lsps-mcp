services:
  postgres:
    image: postgres:16-alpine
    container_name: lsps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lsps
      POSTGRES_PASSWORD: lsps_dev
      POSTGRES_DB: lsps
    ports:
      # 5433 on host to avoid clashing with a system/brew postgres on 5432.
      - "5433:5432"
    volumes:
      - lsps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsps -d lsps"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lsps_pgdata:
